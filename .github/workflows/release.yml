name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOSUMDB: sum.golang.org

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate release tag and tap credentials
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$RELEASE_TAG" != *-* ]]; then test -n "$TAP_KEY"; fi
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          python3 scripts/test-install.py
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Homebrew formula
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/homebrew-formula.py "$RELEASE_TAG" dist/checksums.txt /tmp/owncode.rb
      - name: Check out Homebrew tap
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        uses: actions/checkout@v7.0.1
        with:
          repository: muratmirgun/homebrew-tap
          ref: main
          path: .tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Update Homebrew tap
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p .tap/Formula
          cp /tmp/owncode.rb .tap/Formula/owncode.rb
          cd .tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/owncode.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update OwnCode to $RELEASE_TAG"
            git push origin main
          fi
